# VYBE local stack.  See docs/DEPLOYMENT.md.
#
#   docker compose up -d db redis     # dependencies only
#   docker compose --profile app up   # + backend, migrations, seed
#
# Master Prompt v2 §16.3 requires this to work from a clean machine with no
# private credentials.  TMDB_API_KEY is optional here: without it the catalogue
# serves seeded local content and only provider *refresh* is unavailable
# (ADR-012).

name: vybe

services:
  db:
    image: postgres:17-alpine
    container_name: vybe-db
    environment:
      POSTGRES_USER: vybe
      POSTGRES_PASSWORD: vybe
      POSTGRES_DB: vybe
      # Deterministic collation so index ordering matches CI and production.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `pg_isready` alone returns true before the init scripts finish, which
      # lets migrations race the extension creation.  Probe a real query.
      test: ["CMD-SHELL", "psql -U vybe -d vybe -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    command:
      - postgres
      # Verbose enough to see index usage while tuning §6.3, quiet enough to
      # not drown the log.  Not production settings.
      - -c
      - log_min_duration_statement=200ms
      - -c
      - max_connections=200

  redis:
    image: redis:7-alpine
    container_name: vybe-redis
    ports:
      - "6379:6379"
    # No volume, deliberately.  ADR-009: Redis holds only reconstructible
    # ephemeral state.  If losing this container loses anything that matters,
    # ADR-009 has been violated and the chaos test will catch it.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: tools
    container_name: vybe-migrate
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      VYBE_DB_DSN: postgres://vybe:vybe@db:5432/vybe?sslmode=disable
    command: ["/app/migrate", "up"]
    restart: "no"

  seed:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: tools
    container_name: vybe-seed
    profiles: ["app"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      VYBE_DB_DSN: postgres://vybe:vybe@db:5432/vybe?sslmode=disable
    command: ["/app/seed"]
    restart: "no"

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: runtime
    container_name: vybe-api
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      VYBE_DB_DSN: postgres://vybe:vybe@db:5432/vybe?sslmode=disable
      VYBE_REDIS_ADDR: redis:6379
      VYBE_HTTP_ADDR: ":8080"
      VYBE_ENV: local
      VYBE_LOG_LEVEL: debug
      # Dev-only signing key.  Generated at boot when empty; NEVER do this
      # outside local (docs/SECURITY.md).
      VYBE_JWT_PRIVATE_KEY_B64: ""
      TMDB_API_KEY: "${TMDB_API_KEY:-}"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  db_data:
